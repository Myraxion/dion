[package]
name = "dion"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Windows descript.ion comment CLI"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-width = { version = "0.2", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
